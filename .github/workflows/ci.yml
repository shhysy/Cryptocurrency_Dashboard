name: CI

on:
  push:
    branches: [gpt]
  pull_request:
    branches: [main, master, gpt]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: TypeScript typecheck
        if: always()
        run: npm run typecheck
      - name: Next.js production build
        run: npm run build
