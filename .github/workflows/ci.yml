name: CI # validate tests and types on gpt - sell queue v5 dry-run refresh

on:
  push:
    branches: [gpt]
  pull_request:
    branches: [main, master, gpt]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: TypeScript typecheck
        if: always()
        run: npm run typecheck

  update-strategy33-workbook:
    if: github.ref == 'refs/heads/gpt' && github.event_name == 'push' && contains(github.event.head_commit.message, '启动策略3.3工作簿更新')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出gpt分支
        uses: actions/checkout@v4
        with:
          ref: gpt
          persist-credentials: true
      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装工作簿处理依赖
        run: python -m pip install openpyxl
      - name: 修改并校验策略3.3工作簿
        run: python scripts/update_strategy33_workbook.py
      - name: 中文提交工作簿并清理一次性脚本
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm scripts/update_strategy33_workbook.py
          rm .github/workflows/update-strategy33-workbook.yml
          git add -A
          git commit -m "按用户确认决策更新策略3.3工作簿"
          git push origin HEAD:gpt
