name: 重算策略3.3工作簿公式
on:
  push:
    branches: [gpt]
    paths:
      - 'scripts/recalculate_strategy33.py'
jobs:
  recalculate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装工作簿依赖
        run: |
          python -m pip install openpyxl
          sudo apt-get update
          sudo apt-get install -y libreoffice-calc
      - name: 重算公式并验证
        run: |
          python scripts/recalculate_strategy33.py
          mkdir -p /tmp/recalculated
          libreoffice --headless --convert-to xlsx --outdir /tmp/recalculated 策略3.3.xlsx
          test -s /tmp/recalculated/策略3.3.xlsx
          mv /tmp/recalculated/策略3.3.xlsx 策略3.3.xlsx
          python - <<'PY'
          from openpyxl import load_workbook
          from pathlib import Path
          p=Path("策略3.3.xlsx")
          wb=load_workbook(p,data_only=False)
          cached=load_workbook(p,data_only=True)
          assert "回测评估" not in wb.sheetnames and "自动交易执行" in wb.sheetnames
          assert len(wb.sheetnames)==11
          formulas=[(ws.title,c.coordinate,c.value) for ws in wb.worksheets for row in ws.iter_rows() for c in row if isinstance(c.value,str) and c.value.startswith("=")]
          validations=sum(len(ws.data_validations.dataValidation) for ws in wb.worksheets)
          errors=[(ws.title,c.coordinate,c.value) for ws in cached.worksheets for row in ws.iter_rows() for c in row if isinstance(c.value,str) and c.value.startswith("#")]
          cached_values=sum(1 for ws in wb.worksheets for row in ws.iter_rows() for c in row if isinstance(c.value,str) and c.value.startswith("=") and cached[ws.title][c.coordinate].value is not None)
          backtest=[(ws.title,c.coordinate,c.value) for ws in wb.worksheets for row in ws.iter_rows() for c in row if isinstance(c.value,str) and "回测" in c.value]
          print("SHEETS",wb.sheetnames)
          print("FORMULAS",len(formulas))
          print("VALIDATIONS",validations)
          print("FORMULA_CACHED_VALUES",cached_values)
          print("CACHED_ERRORS",errors)
          print("BACKTEST_TEXT",backtest)
          print("FILE_BYTES",p.stat().st_size)
          assert len(formulas)==2291 and validations==13
          assert cached_values>0 and not errors and not backtest
          PY
      - name: 清理临时文件并提交
        run: |
          rm -f scripts/recalculate_strategy33.py .github/workflows/recalculate-strategy33.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "重新计算策略3.3工作簿公式"
          git push origin HEAD:gpt
